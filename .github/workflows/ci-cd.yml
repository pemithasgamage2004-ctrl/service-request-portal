# CI/CD for the EGUARDIAN Service Request Portal
#
#   lint ────┐
#   secrets ─┤
#   sast ────┼──► build (+ security-results.json) ──► deploy (push to main only)
#   deps ────┘
#
# - Four independent check jobs run in parallel. `build` needs ALL of them, so a
#   failed security gate means nothing is built or deployed.
# - Each check writes a machine-readable result (even when it fails) which `build`
#   merges into security-results.json and publishes with the site.
# - Every action is pinned to a full commit SHA; tools are pinned to exact versions
#   (the gitleaks binary is checksum-verified).
# - Least privilege: read-only token by default; only `deploy` can write to Pages.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SEMGREP_VERSION: 1.183.0

jobs:
  lint:
    name: Lint, tests & data reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint (fails on any error)
        run: |
          npx eslint -f json -o eslint.json . || true
          npx eslint .
      - name: Unit tests
        run: npm test 2>&1 | tee test-output.txt
      - name: Verify sample data is reproducible from the seed
        run: |
          node scripts/generate-data.mjs
          git diff --exit-code -- public/data
      - name: Record result
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: node scripts/ci-result.mjs lint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result-lint
          path: ci-results/result-lint.json

  secrets:
    name: Secret detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full git history, not just the latest commit
          persist-credentials: false
      - name: Install Gitleaks (pinned version, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      # --log-opts=HEAD: scan the full history of the commit being built (for a PR this is
      # the merge commit, so the PR's commits are included). Without it gitleaks scans every
      # fetched ref (`git log --all`), so a secret on an unrelated branch would block main.
      - name: Scan git history for secrets (fails on any finding)
        run: ./gitleaks git . --log-opts=HEAD --redact --no-banner --report-format json --report-path gitleaks.json --exit-code 1
      - name: Record result
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: node scripts/ci-result.mjs secrets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result-secrets
          path: ci-results/result-secrets.json

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Semgrep (pinned)
        run: pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
      - name: Semgrep scan (registry rule packs + project rules)
        run: |
          semgrep scan --metrics=off --json --output semgrep.json \
            --config p/javascript --config p/secrets --config p/github-actions \
            --config .semgrep/
      - name: Gate - fail on ERROR-severity findings
        run: |
          jq -r '.results[] | "\(.extra.severity)\t\(.check_id)\t\(.path):\(.start.line)"' semgrep.json
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep.json)
          echo "ERROR-severity findings: ${errors}"
          test "${errors}" -eq 0
      - name: Record result
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: node scripts/ci-result.mjs sast
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result-sast
          path: ci-results/result-sast.json

  deps:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit report
        run: npm audit --json > audit.json || true
      - name: Gate - fail on critical vulnerabilities
        run: npm audit --audit-level=critical
      - name: Record result
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: node scripts/ci-result.mjs deps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result-deps
          path: ci-results/result-deps.json

  build:
    name: Build site (+ security results)
    needs: [lint, secrets, sast, deps] # all security gates must pass
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Download check results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: ci-results
          merge-multiple: true
      - name: Build (prebuild writes public/security-results.json and copies this workflow)
        run: npm run build
      - name: Show published security summary
        run: cat dist/security-results.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
